<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORESIGHT — Inventory Intelligence</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">📦 FORESIGHT</div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="home">Home</button>
      <button class="nav-item" data-page="sales">Sales Analytics</button>
      <button class="nav-item" data-page="forecast">Demand Forecast</button>
      <button class="nav-item" data-page="inventory">Inventory Dashboard</button>
      <button class="nav-item" data-page="risk">Risk Dashboard</button>
      <button class="nav-item" data-page="product">Product Details</button>
      <button class="nav-item" data-page="summary">Executive Summary</button>
    </nav>
  </aside>

  <main class="content" id="content">
    <div class="loading" id="loading">Loading data…</div>
  </main>
</div>

<template id="tpl-home">
  <h1>FORESIGHT: AI-Powered Demand &amp; Inventory Intelligence Platform</h1>
  <h3>Overview</h3>
  <div class="metric-row" id="home-metrics"></div>
  <h3>Sample Data</h3>
  <div class="table-wrap" id="home-sample"></div>
</template>

<template id="tpl-sales">
  <h1>📊 Sales Analytics</h1>
  <div class="filter-block">
    <span class="filter-label">Filter by Category</span>
    <div class="chip-group" id="sales-category-filter"></div>
  </div>
  <h3>Daily Sales Trend</h3>
  <div class="chart-card"><canvas id="chart-daily-sales"></canvas></div>
  <div class="two-col">
    <div>
      <h3>Units Sold by Category</h3>
      <div class="chart-card"><canvas id="chart-units-category"></canvas></div>
    </div>
    <div>
      <h3>Revenue by Category</h3>
      <div class="chart-card"><canvas id="chart-revenue-category"></canvas></div>
    </div>
  </div>
  <h3>Promotion Impact</h3>
  <div class="table-wrap" id="sales-promo"></div>
</template>

<template id="tpl-forecast">
  <h1>📈 Demand Forecast</h1>
  <p class="caption" id="forecast-caption"></p>
  <div class="metric-row" id="forecast-metrics"></div>
  <h3>Actual vs Predicted (Test Period)</h3>
  <div class="chart-card"><canvas id="chart-forecast-line"></canvas></div>
  <h3>Feature Importance</h3>
  <div class="chart-card chart-tall"><canvas id="chart-forecast-importance"></canvas></div>
</template>

<template id="tpl-inventory">
  <h1>📦 Inventory Dashboard</h1>
  <div class="two-col">
    <div class="filter-block">
      <span class="filter-label">Filter by Warehouse</span>
      <div class="chip-group" id="inv-warehouse-filter"></div>
    </div>
    <div class="filter-block">
      <span class="filter-label">Filter by Category</span>
      <div class="chip-group" id="inv-category-filter"></div>
    </div>
  </div>
  <div class="metric-row" id="inv-metrics"></div>
  <h3>Current Stock vs Reorder Point</h3>
  <div class="chart-card chart-tall"><canvas id="chart-stock-reorder"></canvas></div>
  <h3>Stock Status by Warehouse</h3>
  <div class="chart-card"><canvas id="chart-stock-status"></canvas></div>
  <h3>Inventory Detail</h3>
  <div class="table-wrap" id="inv-table"></div>
</template>

<template id="tpl-risk">
  <h1>⚠️ Risk Dashboard</h1>
  <div class="metric-row" id="risk-metrics"></div>
  <h3>Risk Score by Product</h3>
  <div class="chart-card chart-tall"><canvas id="chart-risk"></canvas></div>
  <h3>Detailed Risk Table</h3>
  <div class="table-wrap" id="risk-table"></div>
</template>

<template id="tpl-product">
  <h1>🔍 Product Details</h1>
  <div class="filter-block">
    <span class="filter-label">Select a Product</span>
    <select id="product-select" class="select"></select>
  </div>
  <h3 id="product-title"></h3>
  <div class="metric-row" id="product-metrics-1"></div>
  <div class="metric-row" id="product-metrics-2"></div>
  <h3>Sales History</h3>
  <div class="chart-card"><canvas id="chart-product-sales"></canvas></div>
  <h3>Stock Level Over Time</h3>
  <div class="chart-card"><canvas id="chart-product-stock"></canvas></div>
  <h3>Sales by Channel</h3>
  <div class="chart-card"><canvas id="chart-product-channel"></canvas></div>
</template>

<template id="tpl-summary">
  <h1>📋 Executive Summary</h1>
  <h3>FORESIGHT — AI-Powered Demand &amp; Inventory Intelligence Platform</h3>
  <h4>Key Business Metrics</h4>
  <div class="metric-row" id="summary-metrics"></div>
  <h4>Top Findings</h4>
  <ul class="findings" id="summary-findings"></ul>
  <h4>Products Requiring Immediate Action</h4>
  <div class="table-wrap" id="summary-table"></div>
  <h4>Recommendation</h4>
  <div class="info-box">Prioritize reordering for the SKUs listed above. Consider renegotiating supplier lead times for chronically high-risk products, or increasing their reorder points to build a larger safety buffer.</div>
</template>

<script src="js/main.js"></script>
</body>
</html>
